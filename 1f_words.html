<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Задание 1f</title></head>
<body>
    <script>
        let s = prompt("Введите строку:");
        if (s !== null) {
            let words = s.split(/\s+/).filter(w => w.length > 0);
            alert([...new Set(words)].join(" "));
        }
    </script>
</body>
</html>
