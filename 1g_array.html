<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Задание 1g</title></head>
<body>
    <script>
        let n = parseInt(prompt("Введите n:"));
        if (n > 0) {
            let arr = Array.from({length: n}, () => Math.floor(Math.random() * 100));
            let rev = arr.slice().reverse();
            let out = "";
            for (let i = 0; i < rev.length; i++) {
                out += rev[i] + "\t";
                if ((i + 1) % 5 === 0) out += "\n";
            }
            alert("Оригинал: " + arr.join(", ") + "\n\n" + out);
        }
    </script>
</body>
</html>
